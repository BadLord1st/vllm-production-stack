apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-models-pv
spec:
  capacity:
    storage: 10Ti
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-manual
  nfs:
    path: /external/disk/data
    server: 10.14.49.31
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-models-pvc
spec:
  storageClassName: nfs-manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
